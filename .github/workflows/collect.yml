name: Collect outage schedules

on:
  # Triggered by an external scheduler (the server's systemd timer) via the
  # workflow_dispatch REST API — see README. GitHub's own cron is intentionally
  # not used (best-effort/throttled). Add a `schedule:` here if you ever want a
  # fallback. workflow_dispatch must exist on the default branch to be callable.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apt is a liability here, so it is touched only when something is really
      # missing. The runner image already has Xvfb and every library Chromium
      # needs; `playwright install --with-deps` only added 9 optional fonts —
      # and on 2026-11-11 the runners couldn't resolve the Ubuntu mirrors, so
      # that font download hung ~15 min and failed every run for hours
      # (earlier, 2026-09-09: a broken Google Chrome repo, "Hash Sum mismatch").
      # The browser itself comes from Playwright's CDN, not apt.
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          CHROME=$(node -e "import('playwright').then(p=>console.log(p.chromium.executablePath()))")
          test -x "$CHROME"
          MISSING=$(ldd "$CHROME" | grep 'not found' || true)
          if [ -n "$MISSING" ] || ! command -v xvfb-run >/dev/null; then
            echo "::warning::Runner image lacks Chromium libs or Xvfb, installing via apt"
            echo "$MISSING"
            sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                       /etc/apt/sources.list.d/google-chrome*.sources
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            for attempt in 1 2 3; do
              sudo apt-get $APT update && break
              echo "apt-get update failed (attempt $attempt), retrying…" >&2
              sleep $((attempt * 5))
            done
            sudo apt-get $APT install -y --no-install-recommends xvfb
            npx playwright install-deps chromium
          fi

      # Persist cleared-challenge cookies between runs to reduce WAF challenges.
      - name: Restore browser state
        uses: actions/cache@v5
        with:
          path: .cache
          key: browser-state-${{ github.run_id }}
          restore-keys: |
            browser-state-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add -B data data-branch origin/data
          else
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Collect schedules
        env:
          LOG_LEVEL: info
          # Run a real, on-screen browser (via xvfb-run below) so Imperva
          # Incapsula clears its JS challenge instead of blocking headless.
          HEADFUL: '1'
          STORAGE_STATE_PATH: ${{ github.workspace }}/.cache/state.json
          # Optional Telegram notifications (set as repo secrets; never logged).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: xvfb-run -a node src/index.js --out data-branch

      # GitHub occasionally answers a push with `remote: Internal Server Error`
      # (seen 2026-09-09 23:08) — the collection itself was fine, only the push
      # was rejected, and a single failure like that fails the whole run and
      # loses the collected data. So retry, and first check whether the server
      # actually applied the push despite the error before retrying it.
      - name: Publish if changed
        run: |
          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "data: update outage schedules ($(date -u +%FT%TZ))"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:data; then
              exit 0
            fi
            echo "push attempt $attempt failed" >&2
            sleep $((attempt * 5))
            git fetch origin data || true
            if git merge-base --is-ancestor HEAD origin/data 2>/dev/null; then
              echo "Commit is already on origin/data — the server applied it despite the error."
              exit 0
            fi
            # Another run (or a partially applied push) moved the branch: replay
            # our commit on top so the retry is a fast-forward.
            git rebase origin/data || git rebase --abort || true
          done
          echo "::error::Could not push to data after 5 attempts"
          exit 1
